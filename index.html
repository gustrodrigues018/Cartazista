<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Estoque - Cartazista</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 30px;
      margin: 0;
    }

    h1 { text-align: center; margin-bottom: 10px; }
    h2 {
      margin: 40px 0 10px;
      border-left: 5px solid #4CAF50;
      padding-left: 10px;
    }

    #pesquisa {
      width: 60%;
      margin: 0 auto 30px;
      display: block;
      padding: 12px;
      font-size: 16px;
    }

    form {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }

    input, button {
      padding: 10px;
      font-size: 15px;
    }

    button {
      background: #4CAF50;
      color: #fff;
      border: none;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #333;
      color: #fff;
    }

    .entrada { background: #2196f3; color: #fff; }
    .saida { background: #f44336; color: #fff; }
  </style>
</head>

<body>

<h1>Controle de Estoque - Cartazista</h1>

<form id="form">
  <input id="nome" placeholder="Nome do artigo" required>
  <input id="categoria" placeholder="Categoria" required>
  <input id="quantidade" type="number" min="1" placeholder="Quantidade" required>
  <input id="tipo" placeholder="Tipo">
  <button type="submit">Adicionar</button>
</form>

<input id="pesquisa" placeholder="Pesquisar...">

<h2>Papéis</h2>
<table>
  <thead>
    <tr>
      <th>Nome</th><th>Categoria</th><th>Qtd</th><th>Tipo</th><th>Ações</th>
    </tr>
  </thead>
  <tbody id="tabela-papeis"></tbody>
</table>

<h2>Consumíveis</h2>
<table>
  <thead>
    <tr>
      <th>Nome</th><th>Categoria</th><th>Qtd</th><th>Tipo</th><th>Ações</th>
    </tr>
  </thead>
  <tbody id="tabela-consumiveis"></tbody>
</table>

<!-- 🔥 FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import {
    getDatabase, ref, push, set, onValue, update, remove
  } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD8iI8BNm9hj9xma1W9N5r_hHSqrCfeoZo",
    authDomain: "cartazista-af2dd.firebaseapp.com",
    databaseURL: "https://cartazista-af2dd-default-rtdb.firebaseio.com",
    projectId: "cartazista-af2dd",
    storageBucket: "cartazista-af2dd.appspot.com",
    messagingSenderId: "100291315254",
    appId: "1:100291315254:web:8f4af8e7aa3b6159f53a97"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const form = document.getElementById('form');
  const pesquisa = document.getElementById('pesquisa');
  const tabelaPapeis = document.getElementById('tabela-papeis');
  const tabelaConsumiveis = document.getElementById('tabela-consumiveis');
  const botao = form.querySelector('button');

  let estoque = [];
  let indiceEdicao = null;

  function normalizar(t='') {
    return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  }

  function atualizarTabelas(filtro='') {
    tabelaPapeis.innerHTML = '';
    tabelaConsumiveis.innerHTML = '';

    estoque
      .filter(i => normalizar(
        `${i.nome}${i.categoria}${i.tipo}`
      ).includes(normalizar(filtro)))
      .forEach((item, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.nome}</td>
          <td>${item.categoria}</td>
          <td>${item.quantidade}</td>
          <td>${item.tipo || '-'}</td>
          <td>
            <button class="entrada" onclick="entrada(${i})">+</button>
            <button class="saida" onclick="saida(${i})">-</button>
            <button onclick="editar(${i})">✏️</button>
            <button onclick="excluir(${i})">🗑️</button>
          </td>
        `;

        normalizar(item.categoria).includes('papel')
          ? tabelaPapeis.appendChild(tr)
          : tabelaConsumiveis.appendChild(tr);
      });
  }

  function carregarEstoque() {
    onValue(ref(db,'estoque'), snap => {
      estoque = [];
      const data = snap.val();
      if (data) {
        Object.keys(data).forEach(id => {
          estoque.push({ id, ...data[id] });
        });
      }
      atualizarTabelas(pesquisa.value);
    });
  }

  form.onsubmit = e => {
    e.preventDefault();

    const nome = form.nome.value.trim();
    const categoria = form.categoria.value.trim();
    const quantidade = +form.quantidade.value;
    const tipo = form.tipo.value.trim();

    if (indiceEdicao !== null) {
      update(ref(db,'estoque/'+estoque[indiceEdicao].id),
        { nome, categoria, quantidade, tipo });
      indiceEdicao = null;
      botao.textContent = 'Adicionar';
    } else {
      set(push(ref(db,'estoque')),
        { nome, categoria, quantidade, tipo });
    }

    form.reset();
  };

  window.entrada = i =>
    update(ref(db,'estoque/'+estoque[i].id),
      { quantidade: estoque[i].quantidade + 1 });

  window.saida = i => {
    if (estoque[i].quantidade > 0)
      update(ref(db,'estoque/'+estoque[i].id),
        { quantidade: estoque[i].quantidade - 1 });
  };

  window.editar = i => {
    const it = estoque[i];
    form.nome.value = it.nome;
    form.categoria.value = it.categoria;
    form.quantidade.value = it.quantidade;
    form.tipo.value = it.tipo || '';
    indiceEdicao = i;
    botao.textContent = 'Salvar';
  };

  window.excluir = i =>
    confirm('Excluir item?') &&
    remove(ref(db,'estoque/'+estoque[i].id));

  pesquisa.oninput = e => atualizarTabelas(e.target.value);

  carregarEstoque();
</script>

</body>
</html>
